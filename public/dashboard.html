<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Henvendelser</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Henvendelser</h1>
  <p class="intro">Godkend sene ankomster. Gæsten får dørkoden på SMS med det samme.</p>

  <form id="login" class="kort" style="display:none">
    <h2>Log ind</h2>
    <div class="felt">
      <label for="username">Brugernavn</label>
      <input id="username">
    </div>
    <div class="felt">
      <label for="password">Password</label>
      <input id="password" type="password">
    </div>
    <button>Log ind</button>
    <p id="fejl"></p>
  </form>

  <div class="dashboard">
    <ul id="liste"></ul>
  </div>

  <script>
    async function hent() {
      const res = await fetch('/api/arrivals');

      if (res.status === 401) {
        document.getElementById('login').style.display = 'block';
        return;
      }

      document.getElementById('login').style.display = 'none';
      const arrivals = await res.json();
      const liste = document.getElementById('liste');
      liste.innerHTML = '';

      arrivals.forEach(a => {
        const li = document.createElement('li');

        const info = document.createElement('div');
        info.className = 'info';
        const navn = document.createElement('div');
        navn.className = 'navn';
        navn.textContent = a.name;
        const detaljer = document.createElement('div');
        detaljer.className = 'detaljer';
        detaljer.textContent = `${a.phone} · ankommer kl. ${a.arrivalTime}`;
        info.append(navn, detaljer);

        const status = document.createElement('span');
        status.className = `status ${a.status}`;
        status.textContent = a.status;

        li.append(info, status);

        if (a.status === 'afventer') {
          const knap = document.createElement('button');
          knap.textContent = 'Godkend';
          knap.onclick = () => godkend(a.id);
          li.appendChild(knap);
        }

        liste.appendChild(li);
      });
    }

    async function godkend(id) {
      await fetch(`/api/arrivals/${id}`, { method: 'PUT' });
      hent();
    }

    document.getElementById('login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });

      if (res.ok) hent();
      else document.getElementById('fejl').textContent = 'Forkert login';
    });

    hent();
  </script>
</body>
</html>
